name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: devtrack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: devtrack_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci_only_jwt_secret_that_is_at_least_32_characters
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Lint client
        run: npm --prefix client run lint

      - name: Build client
        run: npm --prefix client run build

      - name: Lint server
        run: npm --prefix server run lint

      - name: Build server
        run: npm --prefix server run build

      - name: Apply test database migrations
        working-directory: server
        run: npm run db:migrate:test

      - name: Run server tests
        working-directory: server
        run: npm test
